appId: com.yijing.ai.installer
productName: yijing-ai-installer
copyright: (c) 2026 艺镜 AI 团队
directories:
  buildResources: build
  output: dist-installer
asar: true
asarUnpack:
  - payload/**/*
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - public/**/*
  - package.json
  - payload/**/*
extraResources:
  - from: payload
    to: payload
    filter:
      - "**/*"
      - "!trash-*"
      - "!trash-*/**"
      - "!_probe*"
      - "!_probe*/**"
  - from: resources
    to: .
    filter:
      - "license.txt"
win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: YijingAI-Installer-Windows-x64.${ext}
portable:
  artifactName: YijingAI-Installer-Windows-x64.${ext}
mac:
  category: public.app-category.graphics-design
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: YijingAI-Installer-macOS-${arch}.${ext}
dmg:
  artifactName: YijingAI-Installer-macOS-${arch}.${ext}
