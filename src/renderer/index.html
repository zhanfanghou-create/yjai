<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>艺镜AI.正式版 - 无限画布创作工具</title>
  <script>
    // 在 React 加载前设置默认主题，避免闪白；head 阶段 body 还未创建，需写到 html 上。
    (function() {
      try {
        var allowedThemes = ['dark-gray', 'light', 'blue-dark'];
        var savedTheme = localStorage.getItem('yijing-theme');
        var theme = allowedThemes.indexOf(savedTheme) !== -1 ? savedTheme : 'dark-gray';
        if (document.documentElement) {
          document.documentElement.className = 'theme-' + theme;
        }
      } catch (e) {
        if (document.documentElement) {
          document.documentElement.className = 'theme-dark-gray';
        }
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
