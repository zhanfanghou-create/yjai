name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --no-audit --no-fund
        shell: bash
      - name: Force clean tsc incremental cache
        run: rm -rf dist tsconfig.main.tsbuildinfo tsconfig.renderer.tsbuildinfo
        shell: bash
      - name: Build renderer + main
        run: npm run build
        shell: bash
      - name: Package (mac DMG)
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
          if [ -n "$CSC_LINK_SECRET" ]; then
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
            [ -n "$APPLE_ID_SECRET" ] && export APPLE_ID="$APPLE_ID_SECRET"
            [ -n "$APPLE_APP_SPECIFIC_PASSWORD_SECRET" ] && export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
            [ -n "$APPLE_TEAM_ID_SECRET" ] && export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist:mac
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: yijing-ai-mac
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: warn

  build-win:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ---- Main App (unpacked) ----
      - name: Install main app deps
        run: npm ci --no-audit --no-fund
        shell: bash
      - name: Force clean tsc incremental cache
        run: rm -rf dist tsconfig.main.tsbuildinfo tsconfig.renderer.tsbuildinfo
        shell: bash
      - name: Build renderer + main
        run: npm run build
        shell: bash
      - name: Package main app to release/win-unpacked
        env:
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          npm run pack:win
          ls -la release/win-unpacked || true
        shell: bash

      # ---- Installer UI (custom graphical portable installer) ----
      - name: Install installer-ui deps
        working-directory: installer-ui
        run: npm install --no-audit --no-fund
        shell: bash
      - name: Pack main app into installer payload (app.7z + 7za)
        working-directory: installer-ui
        run: node scripts/pack-payload.mjs "$GITHUB_WORKSPACE/release/win-unpacked"
        shell: bash
      - name: Build installer-ui portable exe
        working-directory: installer-ui
        env:
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          npm run dist:win
          ls -la dist-installer || true
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: yijing-ai-win
          path: |
            installer-ui/dist-installer/*.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: yijing-ai-win
          path: dist-release/win

      - name: Download Mac packages (x64 + arm64)
        uses: actions/download-artifact@v4
        with:
          name: yijing-ai-mac
          path: dist-release/mac

      - name: Calculate SHA256 checksums
        run: |
          cd dist-release
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "### v$VERSION 发布说明" > release-body.txt
          echo "" >> release-body.txt
          echo "**SHA256 校验和**" >> release-body.txt
          echo "" >> release-body.txt
          echo '```text' >> release-body.txt
          find . -type f \( -name "*.exe" -o -name "*.dmg" \) | sort | while read -r f; do
            name=$(basename "$f")
            hash=$(sha256sum "$f" | awk '{print $1}')
            echo "SHA256 ($name) = $hash" >> release-body.txt
          done
          echo '```' >> release-body.txt
          echo "" >> release-body.txt
          echo "**更新说明**" >> release-body.txt
          echo "- 支持 SHA256 校验，确保下载文件完整性" >> release-body.txt
          echo "- 下载完成后自动启动安装程序" >> release-body.txt
          echo "- 自动识别旧版本安装路径并覆盖安装" >> release-body.txt
          echo "- 安装前自动关闭正在运行的旧版本" >> release-body.txt
          cat release-body.txt
          cp release-body.txt ${{ github.workspace }}/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.txt
          files: |
            dist-release/win/*.exe
            dist-release/mac/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
