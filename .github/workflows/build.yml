name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: yijing-ai-win
          - os: macos-latest
            script: dist:mac
            artifact: yijing-ai-mac

    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund
        shell: bash

      - name: Force clean tsc incremental cache
        run: rm -rf dist tsconfig.main.tsbuildinfo tsconfig.renderer.tsbuildinfo
        shell: bash

      - name: Build renderer + main
        run: npm run build
        shell: bash

      - name: Verify main.js exists
        run: |
          ls -la dist/main/main.js
          ls -la dist/renderer/index.html
        shell: bash

      # 签名策略：仓库没有配置 CSC_* / APPLE_* Secrets 时，直接跳过签名。
      # electron-builder 24 对空字符串 CSC_LINK 会当路径解析成 cwd，故用 shell 层判断并 export，而不是通过 workflow env 传空串。
      - name: Package (${{ matrix.os }})
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          # 一律先清空可能残留的签名 env（GitHub 有时会注入空串）
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -n "$CSC_LINK_SECRET" ]; then
              export CSC_LINK="$CSC_LINK_SECRET"
              export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
              [ -n "$APPLE_ID_SECRET" ] && export APPLE_ID="$APPLE_ID_SECRET"
              [ -n "$APPLE_APP_SPECIFIC_PASSWORD_SECRET" ] && export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
              [ -n "$APPLE_TEAM_ID_SECRET" ] && export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
              echo "mac: signing enabled"
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              echo "mac: signing skipped (no CSC_LINK secret)"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "win: signing skipped"
          fi

          npm run ${{ matrix.script }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
