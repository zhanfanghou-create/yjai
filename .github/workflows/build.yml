name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_DOWNLOAD_MAX_ATTEMPTS: '8'
      ELECTRON_BUILDER_DOWNLOAD_RETRY_DELAY: '5000'
      ELECTRON_BUILDER_DOWNLOADER_PARTS: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Mac installer
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux installer
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 30

      - name: Upload Mac artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          retention-days: 30

  # 源码仓库发布（新流程）：三端安装包上传到本仓库 GitHub Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-installer/*.exe
            mac-installer/*.dmg
            mac-installer/*.zip
            linux-installer/*.AppImage
            linux-installer/*.deb
            linux-installer/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 公开下载仓库同步（沿用旧流程方式）：GitHub downloads 正式版 + CNB + 阿里云 OSS + latest.json
  publish-public:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Rename to public installer names
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          find windows-installer -name '*.exe' -exec mv {} dist/YijingAI-Installer-Windows-x64.exe \;
          find mac-installer -name "yijing-ai-${VERSION}-mac-x64.dmg" -exec mv {} dist/YijingAI-Installer-macOS-x64.dmg \;
          find mac-installer -name "yijing-ai-${VERSION}-mac-arm64.dmg" -exec mv {} dist/YijingAI-Installer-macOS-arm64.dmg \;
          test -f dist/YijingAI-Installer-Windows-x64.exe
          test -f dist/YijingAI-Installer-macOS-x64.dmg
          test -f dist/YijingAI-Installer-macOS-arm64.dmg
          ls -la dist

      - name: Create public draft release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_REPO_TOKEN }}
          PUBLIC_REPO: zhanfanghou-create/yijing-ai-downloads
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --repo "$PUBLIC_REPO"
          else
            gh release create "$TAG" --repo "$PUBLIC_REPO" --target main --title "艺镜 AI v${VERSION}" --notes "艺镜 AI 无限画布 v${VERSION} 正式版。包含 Windows 与两种 macOS 芯片安装包。" --draft
          fi

      - name: Upload installers to public draft release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_REPO_TOKEN }}
          PUBLIC_REPO: zhanfanghou-create/yijing-ai-downloads
        shell: bash
        run: |
          gh release upload "v${VERSION}" dist/YijingAI-Installer-Windows-x64.exe dist/YijingAI-Installer-macOS-x64.dmg dist/YijingAI-Installer-macOS-arm64.dmg --clobber --repo "$PUBLIC_REPO"

      - name: Generate public update manifest
        run: node scripts/create-release-manifest.mjs "$VERSION" "zhanfanghou-create/yijing-ai-downloads" "yijingshijue-2026/yijing-ai-downloads" dist/YijingAI-Installer-Windows-x64.exe dist/YijingAI-Installer-macOS-x64.dmg dist/YijingAI-Installer-macOS-arm64.dmg dist/latest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_REPO_TOKEN }}
          PUBLIC_REPO: zhanfanghou-create/yijing-ai-downloads
        run: |
          gh release upload "v${VERSION}" dist/latest.json --clobber --repo "$PUBLIC_REPO"
          gh release edit "v${VERSION}" --draft=false --latest --repo "$PUBLIC_REPO"

      - name: Publish installers to CNB domestic release
        continue-on-error: true
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPOSITORY: yijingshijue-2026/yijing-ai-downloads
          CNB_RELEASE_TAG: v${{ env.VERSION }}
          CNB_RELEASE_TITLE: 艺镜 AI v${{ env.VERSION }}
          CNB_RELEASE_NOTES: 艺镜 AI 无限画布正式版，包含 Windows 与 Intel/Apple Silicon macOS 安装包。
        run: node scripts/publish-cnb-release.mjs dist/YijingAI-Installer-Windows-x64.exe dist/YijingAI-Installer-macOS-x64.dmg dist/YijingAI-Installer-macOS-arm64.dmg dist/latest.json

      - name: Publish installers to Alibaba Cloud OSS
        if: always()
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-hangzhou
          VERSION: ${{ env.VERSION }}
        run: |
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          curl -fsSL https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip -o ossutil.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  ossutil.zip" | sha256sum -c -
          unzip -q ossutil.zip -d ossutil-bin
          OSSUTIL=$(find ossutil-bin -type f -name ossutil -print -quit)
          chmod +x "$OSSUTIL"
          "$OSSUTIL" cp dist/YijingAI-Installer-Windows-x64.exe "oss://yjai-releases-cn-20260818/yijing/v${VERSION}/YijingAI-Installer-Windows-x64.exe" -f
          "$OSSUTIL" cp dist/YijingAI-Installer-macOS-x64.dmg "oss://yjai-releases-cn-20260818/yijing/v${VERSION}/YijingAI-Installer-macOS-x64.dmg" -f
          "$OSSUTIL" cp dist/YijingAI-Installer-macOS-arm64.dmg "oss://yjai-releases-cn-20260818/yijing/v${VERSION}/YijingAI-Installer-macOS-arm64.dmg" -f
          "$OSSUTIL" cp dist/latest.json oss://yjai-releases-cn-20260818/yijing/latest.json -f

      - name: Update CNB latest manifest branch
        if: always()
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPOSITORY: yijingshijue-2026/yijing-ai-downloads
          VERSION: ${{ env.VERSION }}
        run: |
          ASKPASS="$RUNNER_TEMP/cnb-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'cnb' ;;
            *Password*) printf '%s\n' "$CNB_TOKEN" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          git clone --depth 1 "https://cnb.cool/${CNB_REPOSITORY}" cnb-release-repo
          cp dist/latest.json cnb-release-repo/latest.json
          cd cnb-release-repo
          git config user.name "YJAI Release Bot"
          git config user.email "release@yjai.top"
          git add latest.json
          git diff --cached --quiet || git commit -m "Update release manifest v${VERSION}"
          git push origin main
