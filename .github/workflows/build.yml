name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --no-audit --no-fund --registry=https://registry.npmmirror.com
        shell: bash
      - name: Force clean tsc incremental cache
        run: rm -rf dist tsconfig.main.tsbuildinfo tsconfig.renderer.tsbuildinfo
        shell: bash
      - name: Build renderer + main
        run: npm run build
        shell: bash
      - name: Package (mac DMG)
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
          if [ -n "$CSC_LINK_SECRET" ]; then
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
            [ -n "$APPLE_ID_SECRET" ] && export APPLE_ID="$APPLE_ID_SECRET"
            [ -n "$APPLE_APP_SPECIFIC_PASSWORD_SECRET" ] && export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
            [ -n "$APPLE_TEAM_ID_SECRET" ] && export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          
          echo "馃敡 绂佺敤 Spotlight 绱㈠紩..."
          sudo mdutil -a -i off 2>/dev/null || true
          
          echo "馃敡 鏉€姝诲彲鑳藉崰鐢ㄧ鐩橀暅鍍忕殑杩涚▼..."
          killall -9 Finder 2>/dev/null || true
          killall -9 DiskImages2 2>/dev/null || true
          killall -9 diskimagesiod 2>/dev/null || true
          
          sleep 3
          
          MAX_RETRIES=3
          RETRY_DELAY=10
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "========================================"
            echo "馃摝 灏濊瘯绗?$i / $MAX_RETRIES 娆?macOS DMG 鏋勫缓..."
            echo "========================================"
            echo ""
            npm run dist:mac
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo ""
              echo "鉁?macOS DMG 鏋勫缓鎴愬姛锛?
              sleep 5
              exit 0
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo ""
              echo "鈿狅笍  绗?$i 娆℃瀯寤哄け璐?(閫€鍑虹爜: $EXIT_CODE)锛?RETRY_DELAY 绉掑悗閲嶈瘯..."
              sleep $RETRY_DELAY
            else
              echo ""
              echo "鉂?$MAX_RETRIES 娆″皾璇曞潎澶辫触锛岄€€鍑?
              exit $EXIT_CODE
            fi
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: yijing-ai-mac
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: warn

  build-win:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install main app deps
        run: npm ci --no-audit --no-fund --registry=https://registry.npmmirror.com
        shell: bash
      - name: Force clean tsc incremental cache
        run: rm -rf dist tsconfig.main.tsbuildinfo tsconfig.renderer.tsbuildinfo
        shell: bash
      - name: Build renderer + main
        run: npm run build
        shell: bash
      - name: Package main app to release/win-unpacked
        env:
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npm run pack:win
          ls -la release/win-unpacked || true
        shell: bash

      - name: Install installer-ui deps
        working-directory: installer-ui
        run: npm install --no-audit --no-fund --registry=https://registry.npmmirror.com
        shell: bash
      - name: Pack main app into installer payload
        working-directory: installer-ui
        run: node scripts/pack-payload.mjs "$GITHUB_WORKSPACE/release/win-unpacked"
        shell: bash
      - name: Build installer-ui portable exe
        working-directory: installer-ui
        env:
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          npm run dist:win
          ls -la dist-installer || true
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: yijing-ai-win
          path: |
            installer-ui/dist-installer/*.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    # 允许手动触发和 tag 触发 # if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: yijing-ai-win
          path: dist-release/win

      - name: Download Mac packages
        uses: actions/download-artifact@v4
        with:
          name: yijing-ai-mac
          path: dist-release/mac

      - name: Calculate SHA256 checksums
        run: |
          cd dist-release
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "### v$VERSION Release Notes" > release-body.txt
          echo "" >> release-body.txt
          echo "**SHA256 Checksums**" >> release-body.txt
          echo "" >> release-body.txt
          echo '```text' >> release-body.txt
          find . -type f \( -name "*.exe" -o -name "*.dmg" \) | sort | while read -r f; do
            name=$(basename "$f")
            hash=$(sha256sum "$f" | awk '{print $1}')
            echo "SHA256 ($name) = $hash" >> release-body.txt
          done
          echo '```' >> release-body.txt
          echo "" >> release-body.txt
          echo "**Release Highlights**" >> release-body.txt
          echo "- Custom installer UI with modern design" >> release-body.txt
          echo "- Auto-launch after installation" >> release-body.txt
          echo "- Smart previous version detection" >> release-body.txt
          cat release-body.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist-release/release-body.txt
          files: |
            dist-release/win/*.exe
            dist-release/mac/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

