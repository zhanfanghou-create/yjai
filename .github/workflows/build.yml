name: Build Custom Installer Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact_glob: installer-ui/dist-installer/*.exe
          - os: macos-14
            platform: mac
            arch: x64
            artifact_glob: installer-ui/dist-installer/*-x64.dmg
          - os: macos-14
            platform: mac
            arch: arm64
            artifact_glob: installer-ui/dist-installer/*-arm64.dmg
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_BUILDER_DOWNLOAD_MAX_ATTEMPTS: '8'
      ELECTRON_BUILDER_DOWNLOAD_RETRY_DELAY: '5000'
      ELECTRON_BUILDER_DOWNLOADER_PARTS: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install main application dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build main application
        shell: bash
        run: |
          npm run build:renderer
          npx tsc -p tsconfig.main.json

      - name: Build unpacked Windows payload
        if: matrix.platform == 'win'
        shell: bash
        run: |
          unset ELECTRON_MIRROR ELECTRON_CUSTOM_DIR ELECTRON_CUSTOM_FILENAME npm_config_electron_mirror NPM_CONFIG_ELECTRON_MIRROR
          npx electron-builder --dir --win --x64 --publish never

      - name: Build unpacked macOS payload
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          unset ELECTRON_MIRROR ELECTRON_CUSTOM_DIR ELECTRON_CUSTOM_FILENAME npm_config_electron_mirror NPM_CONFIG_ELECTRON_MIRROR
          npx electron-builder --dir --mac --${{ matrix.arch }} --publish never

      - name: Install installer dependencies
        working-directory: installer-ui
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Install macOS payload tool
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          brew install sevenzip || brew install p7zip
          command -v 7zz || command -v 7z

      - name: Pack installer payload
        working-directory: installer-ui
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            node scripts/pack-payload.mjs ../release/win-unpacked
          elif [ "${{ matrix.arch }}" = "x64" ]; then
            app_path=$(find ../release/mac -maxdepth 1 -type d -name '*.app' | head -n 1)
            test -n "$app_path"
            node scripts/pack-payload.mjs "$app_path"
          else
            app_path=$(find ../release/mac-arm64 -maxdepth 1 -type d -name '*.app' | head -n 1)
            test -n "$app_path"
            node scripts/pack-payload.mjs "$app_path"
          fi

      - name: Build custom installer
        working-directory: installer-ui
        shell: bash
        run: |
          unset ELECTRON_MIRROR ELECTRON_CUSTOM_DIR ELECTRON_CUSTOM_FILENAME npm_config_electron_mirror NPM_CONFIG_ELECTRON_MIRROR
          npm run build
          if [ "${{ matrix.platform }}" = "win" ]; then
            npx electron-builder --win --x64 -c electron-builder.yml --publish never
          else
            npx electron-builder --mac --${{ matrix.arch }} -c electron-builder.yml --publish never
          fi

      - name: Publish custom installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: 艺镜 AI 自定义安装器
          files: ${{ matrix.artifact_glob }}
          fail_on_unmatched_files: true
          overwrite_files: true

  cleanup-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${GITHUB_REF##*/}"
          if [ "$tag" = "$GITHUB_REF" ]; then tag="v1.1.9"; fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              YijingAI-Installer-Windows-x64.exe|YijingAI-Installer-macOS-x64.dmg|YijingAI-Installer-macOS-arm64.dmg) ;;
              *) gh release delete-asset "$tag" "$name" -R "$GITHUB_REPOSITORY" -y ;;
            esac
          done
