name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: yijing-ai-win
          - os: macos-latest
            script: dist:mac
            artifact: yijing-ai-mac

    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund
        shell: bash

      - name: Force clean tsc incremental cache
        run: |
          rm -rf dist tsconfig.main.tsbuildinfo tsconfig.renderer.tsbuildinfo
        shell: bash

      - name: Build renderer + main
        run: npm run build
        shell: bash

      - name: Verify main.js exists
        run: |
          ls -la dist/main/main.js
          ls -la dist/renderer/index.html
        shell: bash

      # macOS 签名 & 公证：读取 GitHub Secrets（可选）
      # 不设置 CSC_LINK / CSC_KEY_PASSWORD 时会跳过签名，dmg 仍能生成，只是首次打开要右键
      # Windows 不参与签名（空值传给 electron-builder 会被误解析成文件路径），故用条件传参
      - name: Package (${{ matrix.os }})
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK != '' || 'false' }}
        run: |
          # Windows: 主动清掉可能残留的空 CSC 变量，防止 electron-builder 把 '' 当文件路径
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          fi
          npm run ${{ matrix.script }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
